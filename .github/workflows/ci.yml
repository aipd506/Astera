name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Any branch, on demand. The triggers above cover main and PRs, so a feature branch gets no CI run
  # of its own — and Linux support needs the matrix green on the branch before a PR exists.
  workflow_dispatch:

# Runs on Windows, macOS and Linux because `npm ci` triggers `electron-builder install-app-deps`,
# which compiles node-pty against the Electron ABI with a platform-specific toolchain (MSVC on
# Windows, clang on macOS, gcc on Linux — node-pty ships no linux prebuild, so there it is a full
# node-gyp build). A successful build on one platform proves nothing about the others. If the build
# breaks here, it breaks in the release workflow too, so every platform must be tested.
#
# Running all three also matters for the suite itself, not just the native build. The tests were
# written on Windows and, until they were published, had never run anywhere else — so they had picked
# up assumptions that only hold there: that os.tmpdir() is already a canonical path (it is not, with
# 8.3 short names on the Windows runner and /var → /private/var on macOS), and that `\` is a path
# separator. Linux is the newest of the three and the one the suite has run on least, and it is the
# only case-sensitive filesystem of the three. Every platform has to run them or those assumptions
# come back.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 22.12 is a hard floor, not a preference: @electron/rebuild and node-abi — which
      # `electron-builder install-app-deps` runs from postinstall — declare >=22.12.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # What machine this actually ran on. The "Runner Image" group above names the image but not its
      # size, and the size is what the suite's timing-sensitive tests care about: rolling.test.ts and
      # codexRolling.test.ts read real files under fake timers, so a slow enough runner makes an fs
      # callback miss its window (see settleIo). Core count also decides how many vitest workers
      # compete for the machine. When one of those tests fails here, this line is the difference
      # between knowing and guessing. node is used rather than nproc/sysctl because it is the one
      # thing already installed on all three.
      - name: Runner spec
        shell: bash
        run: node -e 'const os = require("node:os"); console.log(os.platform(), os.arch(), "|", os.cpus().length, "vCPU |", Math.round(os.totalmem() / 1024 ** 3), "GB RAM")'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The agent app workspace against a real display (docs/agent-workspace-isolation.md). The unit
      # tests above drive every desk with fakes; these two start Xvfb or a background app for real.
      # They are gated on ASTERA_DESKTOP_E2E=1, so `npm test` collects and skips them, and a run here
      # that reports them skipped means the gate did not open, which is a failure to read, not a pass.
      # After the build (preflight ruling F6), so a failing or flaky e2e never skips the build step.
      - name: Linux desktop tools for the agent workspace e2e
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick

      - name: Agent workspace e2e (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          ASTERA_DESKTOP_E2E: '1'
        run: npx vitest run src/host/workspace/desktop.linux.e2e.test.ts

      - name: Agent workspace e2e (macOS, background)
        if: runner.os == 'macOS'
        env:
          ASTERA_DESKTOP_E2E: '1'
        run: npx vitest run src/host/workspace/desktop.mac.e2e.test.ts
